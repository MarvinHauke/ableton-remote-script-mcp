# The UC4 script's behaviour checklist (docs/feature-plans/milestone-1/faderfox-uc4.md) as far as
# MIDI and Log.txt can decide it, for `ableton-remote-script-mcp rig run` (plan 0002 step 2).
# Expected values are the user's load-test results, Live 12.4.16, 2026-11-18. Run it in the test
# Set (devSetup.als: 8 tracks, none muted, soloed or armed at the start); it changes the Set and
# turns toggles back, and never saves.
#
# Live sends a value back only when it changes (12.4.16, the second run of 2026-11-18: the same
# values again got no reply), so each value step first sends one below it.
#
# Item 1 (loads) is the run's start: Live sends the start-up state on the rig's port.
# Items 2, 5's device follow, 12 and 13 need eyes on Live: they are `ask_user` steps.
# Item 14 (disconnect) is the user's action in Live and stays in the milestone checklist.

script: .
build: 12.4.16
settle: 1.5
# with AbletonMCP running (plan 0002 step 3): the test Set must have these
requires:
  tracks: 8
  returns: 2
  devices: [1, 2]
  clips: [{track: 1, scene: 1}]   # created when missing: a plain clip, no follow action
steps:
  - id: session-box
    description: "2: a box of 8 tracks x 1 scene"
    ask_user: Is there a box around tracks 1-8 and one scene in Session View?

  - id: fader-1
    description: "3: fader 1 sets track 1's volume and Live sends the value back (feedback, fix 2)"
    send:
      - faders[0]: 99
      - faders[0]: 100
    expect:
      faders[0]: 100
    state:
      track 1: {volume: 0.787}   # 100/127
    events:
      - {type: volume_changed, track: 1}
    log: clean
  - id: fader-8
    description: "3: fader 8 sets track 8's volume"
    send:
      - faders[7]: 49
      - faders[7]: 50
    expect:
      faders[7]: 50
    log: clean
  - id: crossfader
    description: "3: fader 9 sets the crossfader"
    send:
      - crossfader: 63
      - crossfader: 64
    expect:
      crossfader: 64
    log: clean

  - id: send-a
    description: "4: Send 1 encoder 1 sets track 1's send A"
    send:
      - send_a_encoders[0]: 29
      - send_a_encoders[0]: 30
    expect:
      send_a_encoders[0]: 30
    log: clean
  - id: send-b
    description: "4: Send 2 encoder 8 sets track 8's send B (the test Set has 2 returns: no send C or D)"
    send:
      - send_b_encoders[7]: 29
      - send_b_encoders[7]: 30
    expect:
      send_b_encoders[7]: 30
    log: clean
  - id: pan
    description: "4: Pan encoder 1 sets track 1's pan"
    send:
      - pan_encoders[0]: 39
      - pan_encoders[0]: 40
    expect:
      pan_encoders[0]: 40
    state:
      track 1: {panning: -0.370}   # -1 + 2 * 40/127
    log: clean

  - id: select-track-1
    description: "10: Select 1 selects track 1 and its LED lights"
    send:
      select_buttons[0]: press
    expect:
      select_buttons[0]: 127
    log: clean
  - id: rack
    depends_on: select-track-1
    description: "5: Rack encoder 1 sets the selected track's device parameter 1 (the test Set has a rack on every track)"
    send:
      - rack_encoders[0]: 19
      - rack_encoders[0]: 20
    expect:
      rack_encoders[0]: 20
    log: clean
  - id: track-volume
    depends_on: select-track-1
    description: "6: Track encoder 1 sets the selected track's volume; fader 1 follows"
    send:
      - track_volume_encoder: 89
      - track_volume_encoder: 90
    expect:
      track_volume_encoder: 90
      faders[0]: 90
    log: clean
  - id: track-pan
    depends_on: select-track-1
    description: "6: Track encoder 6 sets the selected track's pan; Pan encoder 1 follows"
    send:
      - track_pan_encoder: 69
      - track_pan_encoder: 70
    expect:
      track_pan_encoder: 70
      pan_encoders[0]: 70
    log: clean
  - id: next-track
    description: "6: Track encoder 4 (relative) selects the next track; Select 2 lights"
    depends_on: select-track-1
    send:
      track_select_encoder: 1
    expect:
      select_buttons[1]: 127
      select_buttons[0]: 0
    log: clean
  - id: select-back
    send:
      select_buttons[0]: press
    expect:
      select_buttons[0]: 127
    log: clean

  - id: cue-volume
    description: "7: Global encoder 3 sets the cue volume"
    send:
      - cue_volume_encoder: 79
      - cue_volume_encoder: 80
    expect:
      cue_volume_encoder: 80
    log: clean
  - id: master-volume
    description: "7: Global encoder 6 sets the master volume"
    send:
      - master_volume_encoder: 99
      - master_volume_encoder: 100
    expect:
      master_volume_encoder: 100
    log: clean
  - id: tempo-and-quant
    description: "7: tempo coarse up, quantization up and down (fix 3: no ArgumentError)"
    send:
      - tempo_coarse_encoder: 1
      - quantization_encoder: 1
      - quantization_encoder: -1
    events:
      - {type: tempo_changed}   # +1 and -1 at once change nothing Live reports (2026-11-18)
    log: clean
  - id: tempo-back
    send:
      tempo_coarse_encoder: -1
    events:
      - {type: tempo_changed}
    log: clean

  - id: mute-1
    description: "10: Active 1 mutes track 1; its LED goes dark (fix 4: lit while the track plays)"
    send:
      active_buttons[0]: press
    expect:
      active_buttons[0]: 0
    state:
      track 1: {mute: true}
    events:
      - {type: mute_changed, track: 1}
    log: clean
  - id: unmute-1
    depends_on: mute-1
    send:
      active_buttons[0]: press
    expect:
      active_buttons[0]: 127
    state:
      track 1: {mute: false}
    log: clean
  - id: solo-1
    description: "10, 13: Solo 1 lights; Active 2 goes dark, as tracks a solo silences count as muted"
    send:
      solo_buttons[0]: press
    expect:
      solo_buttons[0]: 127
      active_buttons[1]: 0
    state:
      track 1: {solo: true}
      track 2: {mute: false}   # silenced by the solo, not muted
    log: clean
  - id: unsolo-1
    depends_on: solo-1
    send:
      solo_buttons[0]: press
    expect:
      solo_buttons[0]: 0
      active_buttons[1]: 127
    state:
      track 1: {solo: false}
    log: clean
  - id: arm-1
    description: "10: Record 1 arms track 1 and lights"
    send:
      record_buttons[0]: press
    expect:
      record_buttons[0]: 127
    state:
      track 1: {arm: true}
    log: clean
  - id: disarm-1
    depends_on: arm-1
    send:
      record_buttons[0]: press
    expect:
      record_buttons[0]: 0
    state:
      track 1: {arm: false}
    log: clean
  - id: monitor-in
    description: "11: Monitor 1 switches track 1 to In and lights"
    send:
      monitor_buttons[0]: press
    expect:
      monitor_buttons[0]: 127
    log: clean
  - id: monitor-auto
    depends_on: monitor-in
    send:
      monitor_buttons[0]: press
    expect:
      monitor_buttons[0]: 0
    log: clean

  - id: launch
    description: "9: Launch 1 starts track 1's clip in scene 1; Live lights Launch 1 and Stop 1"
    send:
      launch_buttons[0]: press
    wait: 2.5   # clips start and stop on the next bar
    timeout: 5.0
    expect:
      launch_buttons[0]: 127
      stop_buttons[0]: 127
    events:
      - {type: clip_playing_changed, track: 1, clip: 1}
    log: clean
  - id: stop-all
    depends_on: launch
    description: "8, 9: Stop All Clips stops it; Stop 1 goes dark"
    send:
      stop_all_clips_button: press
    wait: 2.5
    timeout: 5.0
    expect:
      stop_buttons[0]: 0
    log: clean
  - id: stop-transport
    send:
      stop_button: press
    state:
      song: {is_playing: false}
    log: clean

  # Live -> controller (AbletonMCP does it in Live; the script must send it to the UC4)
  - id: select-track-2
    send:
      select_buttons[1]: press
    expect:
      select_buttons[1]: 127
  - id: macro-to-rack-encoder
    depends_on: select-track-2
    description: "5: a macro changed in Live shows on Rack encoder 1 (the device of the selected track 2)"
    do:
      - set_device_parameter: {track: 2, device: 1, parameter: 2, value: 64}   # Macro 1
    expect:
      rack_encoders[0]: 64
    log: clean
  - id: macro-back
    depends_on: macro-to-rack-encoder
    do:
      - set_device_parameter: {track: 2, device: 1, parameter: 2, value: 0}
    expect:
      rack_encoders[0]: 0
  - id: fire-clip-to-leds
    description: "9: a clip fired in Live lights Launch 1 and Stop 1"
    do:
      - fire_clip: {track: 1, clip: 1}
    wait: 2.5
    timeout: 5.0
    expect:
      launch_buttons[0]: 127
      stop_buttons[0]: 127
    log: clean
  - id: stop-clip-to-leds
    depends_on: fire-clip-to-leds
    description: "9: a clip stopped in Live turns Stop 1 off"
    do:
      - stop_clip: {track: 1, clip: 1}
    wait: 2.5
    timeout: 5.0
    expect:
      stop_buttons[0]: 0
    log: clean
  - id: stop-playback
    do:
      - stop_playback: {}
    state:
      song: {is_playing: false}
  - id: select-track-1-again
    send:
      select_buttons[0]: press
    expect:
      select_buttons[0]: 127

  - id: navigation
    description: "12: Next Track moves the selection; Next Device moves through the devices"
    send:
      - next_track_button: press
      - prev_track_button: press
      - next_device_button: press
      - prev_device_button: press
    ask_user: Did the selection move to track 2 and back, and the device selection right and back?
    log: clean
  - id: device-follows
    description: "5: the Rack encoders follow the selected device"
    ask_user: After selecting another device in Live, do the Rack encoders show its parameters?
  - id: group-leds
    description: "13: each green button group shows its own state at once (needs the UC4 itself: the device keeps the LED state per group)"
    ask_user: With the UC4 connected, after switching to another green button group and back, do the LEDs show that group's state?
