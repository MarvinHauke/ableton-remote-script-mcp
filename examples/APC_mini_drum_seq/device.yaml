# The Akai APC mini mk1 for the drum sequencer (device facts: elements.py and
# docs/feature-plans/milestone-1/apc-mini-mk1.md). For the test rig, plan 0003 step 1.
name: Akai APC mini mk1, drum sequencer
identity:
  reply: none   # the script doesn't ask; the mk1's identity reply is not used
# The grid as on the device: the 32 steps on top, the 4x4 pad bank bottom left, the resolution
# pads in its row (on the APC right of its top row; the three rows below are dark, not
# elements; plan 0003 Decision 30);
# the scene buttons right of the grid, the track buttons below.
layout:
  - [steps, scene_buttons]
  - [pads, resolution_pads]
  - [track_buttons, shift_button]
  - [faders, master_fader]
# Akai's APC mini protocol (documented, confirmed for this unit by the mk1 load test): a grid
# pad's colour is the velocity Live sends; track buttons are red, scene buttons green.
leds:
  steps: &grid
    0: off
    1: green
    2: green blink
    3: red
    4: red blink
    5: yellow
    6: yellow blink
  pads: *grid
  resolution_pads: *grid
  track_buttons:
    0: off
    1: red
    2: red blink
  scene_buttons:
    0: off
    1: green
    2: green blink
