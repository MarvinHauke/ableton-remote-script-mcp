# The drum sequencer's checks for `ableton-remote-script-mcp rig run` (plan 0003 steps 1-5; each
# step of the plan adds its own, Decision 20). Run it in the test Set with a MIDI track 9 that
# has a Drum Rack with a kit and its slots in scenes 1-3 empty (the sequencer edits the selected
# slot, playing or not, plan 0003 Decision 32). The rig selects track 9 and its
# scene 1 slot itself, with an AbletonMCP that has `select_clip_slot` (plan 0002 Decision 29);
# with upstream 1.7.1 the steps that set or read the selection fail. It changes the Set (three
# clips are created and played, the transport is stopped, a MIDI track 10 is added at the end,
# the selected track and scene move, faders set the volumes of tracks 1 and 8 and the master) and
# never saves;
# delete the three clips and track 10 by hand before the next run, or restart Live.
#
# Live sends an LED value only when it changes, so the pad steps first select another pad.
# The pads assume the Drum Rack shows its default bank: C1 (36) is the bottom-left pad, pads[12]
# (the matrix lists its rows top first), and 37 is pads[13] (documented: v3's drum group puts the
# lowest pad bottom left; this run tests it).

script: .
build: 12.4.16
settle: 1.5
requires:
  drum_racks: [9]
  empty_slots: [{track: 9, scene: 1}, {track: 9, scene: 2}, {track: 9, scene: 3}]
steps:
  - id: select-track
    description: the rig selects track 9 (the Drum Rack) and its empty slot in scene 1; the sequencer works on them
    do:
      - select_clip_slot: {track: 9, scene: 1}
    state:
      song: {selected_track: 9, selected_scene: 1}
    log: clean

  - id: pad-select-other
    description: a pad press selects that pad (green blinking)
    send:
      - pads[13]: press
    expect:
      pads[13]: 2
    log: clean
  - id: pad-select-first
    description: C1 is selected; the other pad shows it has a sound (yellow)
    send:
      - pads[12]: press
    expect:
      pads[12]: 2
      pads[13]: 5
    log: clean

  - id: step-creates-clip
    description: on an empty slot, a step press creates the "Drum Seq" clip (2 bars, looping) with the step's note
    send:
      - steps[0]: press
    expect:
      steps[0]: 1
    state:
      track 9 clip 1:
        has_clip: true
        name: Drum Seq
        length: 8
        looping: true
        notes: [[36, 0, 0.25, 100]]
    log: clean
  - id: step-clears
    description: a second press clears the step's note and its LED
    send:
      - steps[0]: press
    expect:
      steps[0]: 0
    state:
      track 9 clip 1: {notes: []}
    log: clean

  - id: pad-changes-pitch
    description: after a pad press the steps write that pad's pitch
    send:
      - pads[13]: press
      - steps[4]: press
    expect:
      steps[4]: 1
    state:
      track 9 clip 1: {notes: [[37, 1.0, 0.25, 100]]}
    log: clean
  - id: step-clears-again
    description: the step is cleared again, so the clip ends empty
    send:
      - steps[4]: press
    expect:
      steps[4]: 0
    state:
      track 9 clip 1: {notes: []}
    log: clean

  # Step 2: the playhead, the loop end, pages. "Drum Seq" plays from here on (created above).
  # The script lights the step it plays yellow (5) and gives it back its own colour after; the
  # empty steps send nothing else, so any reply on one is the playhead.
  # Listening a little longer than the 2-bar loop (8 beats; 4.0 s at the default Set's 120 BPM) reaches every step.
  - id: playhead-moves
    description: the playhead moves along the 32 steps in yellow (the script's own, Decision 17)
    depends_on: [step-creates-clip]
    wait: 5.0
    timeout: 5.5
    expect:
      steps[0]: any
      steps[8]: any
      steps[16]: any
      steps[24]: any
      steps[31]: any
    log: clean

  - id: loop-end-red
    description: on a 1-bar clip the steps beyond its loop end (17-32 at 1/16) are red
    do:
      - select_clip_slot: {track: 9, scene: 2}
      - create_clip: {track: 9, clip: 2, length: 4}
      - fire_clip: {track: 9, clip: 2}
    wait: 3.0
    timeout: 4.0
    expect:
      steps[16]: 3
      steps[31]: 3
    log: clean

  - id: four-bar-clip
    description: a 4-bar clip with a note on step 33 plays (its launch waits for the next bar)
    do:
      - select_clip_slot: {track: 9, scene: 3}
      - create_clip: {track: 9, clip: 3, length: 16}
      - add_notes_to_clip: {track: 9, clip: 3, notes: [[37, 8.0, 0.25, 100]]}
      - fire_clip: {track: 9, clip: 3}
    wait: 3.0
    timeout: 4.0
    log: clean
  # Step 5 (Decision 31): the page follows the playhead while the clip plays. Clip 3 starts at
  # s, the next bar after four-bar-clip's fire (0 < s <= 2 s at 120 BPM); its page 2 (beats
  # 8-16) plays from s+4 to s+8 s. With the playhead running a step lasts its whole timeout:
  # four-bar-clip ends about 4 s after the fire, page-follows about 7 s, always on page 2 (a
  # fire within about 50 ms of a bar line could switch already in four-bar-clip's window).
  - id: page-follows
    description: the steps follow the playhead to page 2 (the note on step 33 shows), track button 2 lights
    depends_on: [four-bar-clip]
    wait: 2.5
    timeout: 3.0
    expect:
      steps[0]: [1, 5]       # the note, or the playhead passing it
      track_buttons[1]: [1, 2]
    log: clean
  # A pick that changes the page pauses following: track button 1 shows page 1 while page 2
  # plays, then track button 2 page 2, which stays while the playhead plays page 1 again (page-two
  # ends 10.6-11.1 s after the fire; after the stop scroll-pitch picks page 2 with track button 2).
  - id: page-one-pick
    description: track button 1 shows page 1 while page 2 plays (page 1 of clip 3 is empty) and is on
    depends_on: [four-bar-clip]
    send:
      - track_buttons[0]: press
    wait: 0.5
    timeout: 0.6
    expect:
      steps[0]: [0, 5]
      track_buttons[0]: 1
    log: clean
  - id: page-two
    description: track button 2 picks page 2 (steps 33-64), which stays while page 1 plays; the clip keeps its loop
    depends_on: [four-bar-clip]
    send:
      - track_buttons[1]: press
    wait: 3.0
    timeout: 3.5
    expect:
      steps[0]: [1, 5]       # the note, or the playhead passing it
      track_buttons[1]: [1, 2]
    state:
      track 9 clip 3: {length: 16, looping: true, loop_start: 0, loop_end: 16}
    log: clean

  # Decision 32: the steps edit the selected slot even while another clip plays on the track
  - id: edit-other-slot
    description: with clip 3 playing, selecting scene 2 shows clip 2 (1 bar, steps 17-32 red)
    depends_on: [four-bar-clip]
    do:
      - select_clip_slot: {track: 9, scene: 2}
    expect:
      steps[16]: 3
      steps[31]: 3
    log: clean
  - id: stop
    description: the transport stops at the end; scene 3 (clip 3) is selected again
    do:
      - stop_playback: {}
      - select_clip_slot: {track: 9, scene: 3}
    state:
      song: {is_playing: false, selected_scene: 3}
    log: clean

  # Step 3: the pad bank. The bank starts at Live's default position (C1 bottom left, row 9 of
  # the rack's 32 rows of 4). Yellow Kit has sounds on 36-51; the rows below 36 are empty.
  # Track 9 is armed by the script (Live's implicit arm), so a pad plays its sound.
  - id: pad-held-red
    description: a held pad is red and plays its sound (track 9 auto-armed)
    send:
      - note 1 0 127
    wait: 0.8
    expect:
      pads[12]: 3
    ask_user: Did you hear the bottom-left pad's sound (Yellow Kit's C1) when the rig held it, and is track 9's arm button lit (auto-arm)?
    log: clean
  - id: pad-released
    description: released, the selected pad blinks green again
    send:
      - note 1 0 0
    expect:
      pads[12]: 2
    log: clean

  - id: scroll-up
    description: scene button 5 scrolls the bank up a row; the bottom-left pad is now 40 (yellow)
    send:
      - scene_buttons[4]: press
    expect:
      pads[12]: 5
    log: clean
  # The sequencer edits the selected slot, clip 3 since `stop` (Decision 32); track button 2
  # shows its page 2, where steps[0] is beat 8.
  - id: scroll-pitch
    description: a pad of the scrolled bank sets the pitch the steps write (40), in the selected clip
    send:
      - track_buttons[1]: press
      - pads[12]: press
      - steps[0]: press
    expect:
      steps[0]: 1
    state:
      track 9 clip 3: {notes: [[37, 8.0, 0.25, 100], [40, 8.0, 0.25, 100]]}
      track 9 clip 1: {notes: []}
    log: clean
  - id: scroll-pitch-clear
    send:
      - steps[0]: press
    state:
      track 9 clip 3: {notes: [[37, 8.0, 0.25, 100]]}
    log: clean
  - id: scroll-top
    description: at the top row (28) scene button 5 is off
    send:
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
    timeout: 6.0
    expect:
      scene_buttons[4]: 0
    log: clean
  - id: scroll-bottom
    description: at the bottom row (0) scene button 6 is off and 5 on again
    send:
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
      - scene_buttons[5]: press
    timeout: 8.0
    expect:
      scene_buttons[4]: 1
      scene_buttons[5]: 0
    log: clean
  - id: scroll-back
    description: back at row 10 (bottom left 40, the selected pad), scene button 6 is on again
    send:
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
      - scene_buttons[4]: press
    timeout: 6.0
    expect:
      scene_buttons[5]: 1
      pads[12]: 2
    log: clean

  # Step 4: the resolution, step 5 (Decisions 29-30): scene button 1 one step finer, 2 one step
  # coarser (1/32, 1/16, 1/8, 1/4; 1/16 at the start), each lit while it can move; the four
  # resolution pads show the active one in yellow (5), and a press sets it. Live sends an LED
  # value only when it changes, so 1/8 shows in the pads and the note it writes. The clip is
  # still clip 3 (4 bars), on page 2 since scroll-pitch: track button 1 goes back to page 1.
  - id: resolution-eighth
    description: scene button 2 sets 1/8; its pad is yellow, 1/16's goes off
    send:
      - track_buttons[0]: press
      - scene_buttons[1]: press
    expect:
      resolution_pads[2]: 5
      resolution_pads[1]: 0
    log: clean
  - id: resolution-note
    description: at 1/8 step 2 writes a note at beat 0.5, one step (0.5 beats) long
    send:
      - steps[1]: press
    expect:
      steps[1]: 1
    state:
      track 9 clip 3: {notes: [[37, 8.0, 0.25, 100], [40, 0.5, 0.5, 100]]}
    log: clean
  - id: resolution-note-clear
    send:
      - steps[1]: press
    state:
      track 9 clip 3: {notes: [[37, 8.0, 0.25, 100]]}
    log: clean
  - id: resolution-coarsest
    description: scene button 2 sets 1/4 and goes off, there is no coarser one
    send:
      - scene_buttons[1]: press
    expect:
      scene_buttons[1]: 0
      resolution_pads[3]: 5
      resolution_pads[2]: 0
    log: clean
  - id: resolution-finest
    description: scene button 1 three times sets 1/32 and goes off; scene button 2 is lit again
    send:
      - scene_buttons[0]: press
      - scene_buttons[0]: press
      - scene_buttons[0]: press
    expect:
      scene_buttons[0]: 0
      scene_buttons[1]: 1
      resolution_pads[0]: 5
      resolution_pads[3]: 0
    log: clean
  - id: resolution-back
    description: scene button 2 sets 1/16 again; scene button 1 is lit again
    send:
      - scene_buttons[1]: press
    expect:
      scene_buttons[0]: 1
      resolution_pads[1]: 5
      resolution_pads[0]: 0
    log: clean
  - id: resolution-pad
    description: the 1/4 pad sets 1/4 (scene button 2 goes off), the 1/16 pad sets 1/16 again
    send:
      - resolution_pads[3]: press
    expect:
      resolution_pads[3]: 5
      resolution_pads[1]: 0
      scene_buttons[1]: 0
    log: clean
  - id: resolution-pad-back
    send:
      - resolution_pads[1]: press
    expect:
      resolution_pads[1]: 5
      resolution_pads[3]: 0
      scene_buttons[1]: 1
    log: clean

  # Step 5 (Decisions 29, 32): scene buttons 3-4 select the previous and next scene, the slot
  # the steps edit. The rig starts from scene 1 (clip 1, 2 bars, empty since step-clears-again).
  - id: scene-next
    description: scene button 4 selects scene 2 and the steps show clip 2 (1 bar, 17-32 red); scene button 3 lights
    do:
      - select_clip_slot: {track: 9, scene: 1}
    send:
      - scene_buttons[3]: press
    expect:
      scene_buttons[2]: 1
      steps[16]: 3
    state:
      song: {selected_track: 9, selected_scene: 2}
    log: clean
  - id: scene-prev
    description: scene button 3 selects scene 1 again (clip 1, 2 bars, step 17 empty) and goes off
    send:
      - scene_buttons[2]: press
    expect:
      scene_buttons[2]: 0
      steps[16]: 0
    state:
      song: {selected_track: 9, selected_scene: 1}
    log: clean

  # Live selects a track AbletonMCP creates: track 10, a MIDI track without a Drum Rack
  - id: no-drum-rack
    description: on a MIDI track without a Drum Rack the pads go dark and a step press creates no clip (the steps were dark already)
    do:
      - create_midi_track: {index: -1}
    send:
      - steps[0]: press
    wait: 1.5
    expect:
      pads[12]: 0
      steps[0]: 0
    state:
      song: {selected_track: 10}
      track 10 clip 1: {has_clip: false}
    log: clean

  # Step 4: the track choice. Scene buttons 7-8 move through Live's visible tracks, then the
  # returns and the master (documented, 12.0's `all_visible_tracks`); track 10 is selected now.
  # Whether the auto-arm gives way to a track armed by hand needs the user's hands during the
  # run, which `ask_user` doesn't wait for: a test by hand (results page).
  - id: track-prev
    description: scene button 7 selects track 9; the sequencer follows it (its pads light again)
    send:
      - scene_buttons[6]: press
    expect:
      pads[12]: 2
    state:
      song: {selected_track: 9}
    log: clean
  - id: track-next
    description: scene button 8 selects track 10 again; no Drum Rack, so the pads go dark
    send:
      - scene_buttons[7]: press
    expect:
      pads[12]: 0
    state:
      song: {selected_track: 10}
    log: clean
  - id: fader-stays
    description: with track 10 selected, fader 1 still sets track 1 (the ring doesn't follow the selection)
    send:
      - faders[0]: 90
    state:
      track 1: {volume: 0.709}
    log: clean
  - id: track-first
    description: on track 1 scene button 7 is off (no track before it)
    send:
      - scene_buttons[6]: press
      - scene_buttons[6]: press
      - scene_buttons[6]: press
      - scene_buttons[6]: press
      - scene_buttons[6]: press
      - scene_buttons[6]: press
      - scene_buttons[6]: press
      - scene_buttons[6]: press
      - scene_buttons[6]: press
    timeout: 5.0
    expect:
      scene_buttons[6]: 0
    state:
      song: {selected_track: 1}
    log: clean
  - id: track-second
    description: scene button 8 selects track 2, and scene button 7 is on again
    send:
      - scene_buttons[7]: press
    expect:
      scene_buttons[6]: 1
    state:
      song: {selected_track: 2}
    log: clean

  # Step 4: the faders, absolute: only the volume they reach is checked (0001 Decision 29)
  - id: fader-1
    description: fader 1 sets track 1's volume (100/127)
    send:
      - faders[0]: 100
    state:
      track 1: {volume: 0.787}
    log: clean
  - id: fader-8
    description: fader 8 sets track 8's volume (64/127)
    send:
      - faders[7]: 64
    state:
      track 8: {volume: 0.504}
    log: clean
  - id: fader-master
    description: fader 9 sets the master volume
    send:
      - master_fader: 127
    state:
      song: {master_track: {volume: 1.0}}
    ask_user: Is there a box around tracks 1-8 in Session View (the faders' tracks)?
    log: clean
