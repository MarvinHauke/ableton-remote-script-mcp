[project]
name = "ableton-remote-script-mcp"
version = "0.1.0"
description = "MCP server and agent skill for writing Ableton Live MIDI Remote Scripts (unofficial)"
readme = "README.md"
license = "MIT"
# Live's Remote Scripts are CPython 3.11 bytecode; marshal can only read them with 3.11.
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
# the test rig (plan 0002): virtual MIDI ports, check files
rig = ["rtmidi2>=1.5", "pyyaml>=6"]

[project.scripts]
ableton-remote-script-mcp = "ableton_remote_script_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "zensical==0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_remote_script_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local_live: needs an installed Ableton Live build; skipped when it is absent"]
